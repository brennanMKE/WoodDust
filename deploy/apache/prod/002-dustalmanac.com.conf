# Plain HTTP for the apex and any other *.dustalmanac.com name: one hop to
# the canonical https://www.dustalmanac.com.
<VirtualHost *:80>
    ServerName dustalmanac.com
    ServerAlias *.dustalmanac.com

    # Let's Encrypt HTTP-01 for the dustalmanac.com lineage (webroot; photon's
    # instance role cannot write this zone, so dns-route53 is not used).
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory "/var/www/letsencrypt/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^(.*)$ https://www.dustalmanac.com$1 [R=301,L]

    ErrorLog  "logs/redirects/http/error_log"
    CustomLog "logs/redirects/http/access_log" vhostlog
</VirtualHost>
