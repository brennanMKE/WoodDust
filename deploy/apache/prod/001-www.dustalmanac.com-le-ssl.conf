# Dust Almanac — PRODUCTION, canonical host www.dustalmanac.com.
# The apex 301s here
# (002-dustalmanac.com-le-ssl.conf).
# Install as /etc/httpd/conf.d/001-www.dustalmanac.com-le-ssl.conf. See
# docs/deployment.md. TLS uses the dustalmanac.com lineage (apex + www, HTTP-01 webroot)
# (certbot; renewals reload Apache through the existing deploy hook).
#
# Apache serves /images/ straight from the release checkout with a long
# cache; everything else is proxied to the Go service on loopback. The Go
# service sets its own security headers (CSP, nosniff, frame-ancestors,
# referrer policy), so they are not repeated here except HSTS.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.dustalmanac.com

    # ---- /images/ : static, from the repo checkout ---------------------------
    # Must stay ahead of the catch-all ProxyPass below.
    ProxyPass /images/ !
    Alias /images/ /opt/dustalmanac/current/images/
    <Directory "/opt/dustalmanac/current/images">
        AllowOverride None
        Options -Indexes -ExecCGI +FollowSymLinks
        Require all granted
        # Prompt notes and reference art (names starting with _) are not published.
        <FilesMatch "^_">
            Require all denied
        </FilesMatch>
        Header always set Cache-Control "public, max-age=2592000"
        Header always set X-Content-Type-Options "nosniff"
        # An SVG opened directly must never run script in the site's origin.
        Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox"
    </Directory>
    <Location "/images/prompts/">
        Require all denied
    </Location>

    # ---- reverse proxy to dustalmanac.service -----------------------------------
    # The port comes from photon's registry (/etc/photon/ports.conf ->
    # 000-ports.conf defines PORT_DUSTALMANAC; the unit gets PORT the same way).
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Submissions are capped at 4000 chars of details; leave headroom.
    LimitRequestBody 65536
    ProxyTimeout 30
    ProxyPass / http://127.0.0.1:${PORT_DUSTALMANAC}/
    ProxyPassReverse / http://127.0.0.1:${PORT_DUSTALMANAC}/

    Header always set Strict-Transport-Security "max-age=300"

    ErrorLog  "logs/sites/www.dustalmanac.com/error_log"
    CustomLog "logs/sites/www.dustalmanac.com/access_log" vhostlog

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/dustalmanac.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dustalmanac.com/privkey.pem
</VirtualHost>
</IfModule>
