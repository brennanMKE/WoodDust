# HTTPS for the apex: 301 to www. The certificate covers only
# dustalmanac.com and www.dustalmanac.com, so no wildcard alias here.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dustalmanac.com

    RewriteEngine on
    RewriteRule ^(.*)$ https://www.dustalmanac.com$1 [R=301,L]

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/dustalmanac.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dustalmanac.com/privkey.pem

    ErrorLog  "logs/redirects/https/error_log"
    CustomLog "logs/redirects/https/access_log" vhostlog
</VirtualHost>
</IfModule>
