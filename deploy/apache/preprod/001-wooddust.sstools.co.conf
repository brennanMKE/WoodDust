# Plain HTTP for wooddust.sstools.co: redirect everything to HTTPS.
# Install as /etc/httpd/conf.d/001-wooddust.sstools.co.conf.
<VirtualHost *:80>
    ServerName wooddust.sstools.co

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =wooddust.sstools.co
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  "logs/redirects/http/error_log"
    CustomLog "logs/redirects/http/access_log" vhostlog
</VirtualHost>
