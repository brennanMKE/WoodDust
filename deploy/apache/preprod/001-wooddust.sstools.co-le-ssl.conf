# Dust Almanac — PRE-PRODUCTION at wooddust.sstools.co (production is
# www.dustalmanac.com, deploy/apache/prod/).
# Install as /etc/httpd/conf.d/001-wooddust.sstools.co-le-ssl.conf. See
# docs/deployment.md. TLS uses the existing sstools.co wildcard lineage
# (certbot; renewals reload Apache through the existing deploy hook).
#
# Apache serves /images/ straight from the release checkout with a long
# cache; everything else is proxied to the Go service on loopback. The Go
# service sets its own security headers (CSP, nosniff, frame-ancestors,
# referrer policy), so they are not repeated here except HSTS.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName wooddust.sstools.co

    # ---- /images/ : static, from the repo checkout ---------------------------
    # Must stay ahead of the catch-all ProxyPass below.
    ProxyPass /images/ !
    Alias /images/ /opt/wooddust/current/images/
    <Directory "/opt/wooddust/current/images">
        AllowOverride None
        Options -Indexes -ExecCGI +FollowSymLinks
        Require all granted
        # Prompt notes and reference art (names starting with _) are not published.
        <FilesMatch "^_">
            Require all denied
        </FilesMatch>
        # Cache successful responses only. A cached 404 would hide an image
        # added later; the site also versions image URLs (?v=<content hash>).
        Header set Cache-Control "public, max-age=2592000"
        Header always set Cache-Control "no-cache" "expr=%{REQUEST_STATUS} -ge 400"
        Header always set X-Content-Type-Options "nosniff"
        # An SVG opened directly must never run script in the site's origin.
        Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox"
    </Directory>
    <Location "/images/prompts/">
        Require all denied
    </Location>

    # ---- reverse proxy to wooddust.service -----------------------------------
    # The port comes from photon's registry (/etc/photon/ports.conf ->
    # 000-ports.conf defines PORT_WOODDUST; the unit gets PORT the same way).
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Submissions are capped at 4000 chars of details; leave headroom.
    LimitRequestBody 65536
    ProxyTimeout 30
    ProxyPass / http://127.0.0.1:${PORT_WOODDUST}/
    ProxyPassReverse / http://127.0.0.1:${PORT_WOODDUST}/

    Header always set Strict-Transport-Security "max-age=300"
    # Pre-prod must never compete with production in search results.
    Header always set X-Robots-Tag "noindex, nofollow"

    ErrorLog  "logs/sites/wooddust.sstools.co/error_log"
    CustomLog "logs/sites/wooddust.sstools.co/access_log" vhostlog

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/sstools.co-wildcard/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sstools.co-wildcard/privkey.pem
</VirtualHost>
</IfModule>
